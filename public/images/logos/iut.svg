    <!-- Gear Ring -->
    <circle cx="0" cy="4" r="14" fill="#064E3B" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="0,-2 3,5 -4,0 4,0 -3,5" fill="#FFFFFF" />
  </g>

  <rect x="55" y="148" width="90" height="24" rx="6" fill="#022C22" stroke="#F59E0B" stroke-width="2" />
  <text x="100" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="900" fill="#F59E0B" text-anchor="middle" letter-spacing="2">
    IUT
