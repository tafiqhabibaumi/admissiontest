      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#iutGrad)" stroke="#F59E0B" stroke-width="4" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3" />
  
  <path id="iutTextTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
  <text font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" letter-spacing="1">
    <textPath href="#iutTextTop" startOffset="50%" text-anchor="middle">
