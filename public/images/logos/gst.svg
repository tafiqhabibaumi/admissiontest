<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#gstGrad)" stroke="#818CF8" stroke-width="4" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" />
  
  <path id="gstTextTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
  <text font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
    <textPath href="#gstTextTop" startOffset="50%" text-anchor="middle">
      GST SCIENCE ADMISSION
    </textPath>
  </text>
  
  <!-- Center Multi-Orbital Atom -->
  <g transform="translate(100,105) scale(0.85)">
    <ellipse cx="0" cy="0" rx="30" ry="11" fill="none" stroke="#38BDF8" stroke-width="2.5" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="30" ry="11" fill="none" stroke="#A855F7" stroke-width="2.5" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="30" ry="11" fill="none" stroke="#F43F5E" stroke-width="2.5" transform="rotate(90)" />
    <circle cx="0" cy="0" r="8" fill="#FACC15" />
  </g>

  <rect x="40" y="148" width="120" height="24" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="2" />
  <text x="100" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="2">
    GST SCIENCE
  </text>
</svg>
