<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 84" width="100%" height="100%">
  <defs>
    <linearGradient id="nagadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F89D22" />
      <stop offset="60%" stop-color="#ED1C24" />
      <stop offset="100%" stop-color="#C1181F" />
    </linearGradient>
  </defs>

  <!-- Clean White Badge Container -->
  <rect width="280" height="84" rx="14" fill="#FFFFFF" />

  <!-- Official Nagad Emblem -->
  <g transform="translate(18, 12)">
    <!-- Swirling Outer Ribbon -->
    <path d="M30 4 C44 4, 56 16, 56 30 C56 44, 44 56, 30 56 C16 56, 4 44, 4 30 C4 20, 10 12, 18 8 C17 12, 17 16, 19 20 C14 23, 11 26, 11 30 C11 40, 19 49, 30 49 C40 49, 49 40, 49 30 C49 19, 40 11, 30 11 C26 11, 22 13, 19 15 C23 9, 26 4, 30 4 Z" fill="url(#nagadGradient)" />
    <!-- Dynamic Inner Swirl Wing -->
    <path d="M29 16 C37 16, 43 22, 43 30 C43 37, 37 43, 29 43 C22 43, 16 37, 16 30 C16 26, 18 22, 22 19 C25 17, 27 16, 29 16 Z" fill="url(#nagadGradient)" opacity="0.95" />
    <!-- Center Dot / Eye -->
    <circle cx="29" cy="30" r="5" fill="#FFFFFF" />
  </g>

  <!-- Official Wordmark: 'nagad' + 'নগদ' -->
  <g transform="translate(86, 20)">
    <!-- Main Red 'nagad' Wordmark -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ED1C24" letter-spacing="-0.8">
      nagad
    </text>

    <!-- Official Bangla 'নগদ' Badge -->
    <text x="114" y="30" font-family="'Baloo Da 2', 'Noto Sans Bengali', sans-serif" font-size="22" font-weight="800" fill="#F89D22">
      নগদ
    </text>

    <!-- Official Subtitle -->
    <text x="1" y="47" font-family="'Noto Sans Bengali', sans-serif" font-size="9.5" font-weight="700" fill="#64748B">
      বাংলাদেশ ডাক বিভাগের ডিজিটাল লেনদেন
    </text>
  </g>
</svg>
